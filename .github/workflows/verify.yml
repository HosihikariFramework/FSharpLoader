name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  assertions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 本仓
        uses: actions/checkout@v7
        with:
          path: provider

      # 验证宿主借核心的 PluginManager。它按 ../.. 找这个目录，所以位置要照着摆。
      - name: 核心
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginManager
          path: PluginManager
          # 跨仓并列检出必须钉同名分支（ADR-0059）；合并顺序固定为契约 → 核心 → 加载器，
          # 否则同批改动里的另一方还停在默认分支上。
          ref: ${{ github.head_ref || github.ref_name }}

      # 契约与核心一起改：并列摆放才能编到新契约。
      - name: 契约
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/PluginAbstractions
          path: Plugin.Abstractions
          # 跨仓并列检出必须钉同名分支（ADR-0059）；合并顺序固定为契约 → 核心 → 加载器，
          # 否则同批改动里的另一方还停在默认分支上。
          ref: ${{ github.head_ref || github.ref_name }}

      # 本机库的 RID 优先解析需要 fork；核心按 ../.. 找它。
      - name: McMaster fork
        uses: actions/checkout@v7
        with:
          repository: HosihikariFramework/DotNetCorePlugins
          path: DotNetCorePlugins
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: 跑断言
        working-directory: provider
        run: dotnet run --project host/Hosihikari.PluginLoader.FSharp.Host.csproj -c Release --nologo
